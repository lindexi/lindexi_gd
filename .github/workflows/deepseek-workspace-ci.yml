name: DeepSeek Workspace CI

on:
  push:
    paths:
      - "SemanticKernelSamples/DeepSeekWpf/**"
      - "SemanticKernelSamples/DeepSeekWpf.Tests/**"
      - "SemanticKernelSamples/AgentLib/**"
      - "SemanticKernelSamples/Microsoft.Agents.AI.Extensions/src/Microsoft.Extensions.AI.DeepSeek/**"
      - "SemanticKernelSamples/Microsoft.Agents.AI.Reasoning/**"
      - ".github/workflows/deepseek-workspace-ci.yml"
  pull_request:
    paths:
      - "SemanticKernelSamples/DeepSeekWpf/**"
      - "SemanticKernelSamples/DeepSeekWpf.Tests/**"
      - "SemanticKernelSamples/AgentLib/**"
      - "SemanticKernelSamples/Microsoft.Agents.AI.Extensions/src/Microsoft.Extensions.AI.DeepSeek/**"
      - "SemanticKernelSamples/Microsoft.Agents.AI.Reasoning/**"
      - ".github/workflows/deepseek-workspace-ci.yml"

jobs:
  build-test-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: SemanticKernelSamples/DeepSeekWpf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          global-json-file: SemanticKernelSamples/DeepSeekWpf/global.json

      - name: Set version
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          "VERSION=1.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INFORMATIONAL_VERSION=1.0.${{ github.run_number }}+$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: |
          dotnet restore ../DeepSeekWpf.Tests/DeepSeekWpf.Tests.csproj
          dotnet restore DeepSeekWpf.csproj -r win-x64

      - name: Build
        run: dotnet build DeepSeekWpf.csproj -c Release --no-restore -p:Version=$env:VERSION -p:InformationalVersion=$env:INFORMATIONAL_VERSION

      - name: Test
        run: dotnet test ../DeepSeekWpf.Tests/DeepSeekWpf.Tests.csproj -c Release --no-restore -p:Version=$env:VERSION -p:InformationalVersion=$env:INFORMATIONAL_VERSION

      - name: Publish win-x64
        run: dotnet publish DeepSeekWpf.csproj -c Release --no-restore -p:PublishProfile=win-x64 -p:Version=$env:VERSION -p:InformationalVersion=$env:INFORMATIONAL_VERSION -o artifacts/publish/win-x64

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWpf-win-x64-${{ github.run_number }}
          path: SemanticKernelSamples/DeepSeekWpf/artifacts/publish/win-x64
          if-no-files-found: error
